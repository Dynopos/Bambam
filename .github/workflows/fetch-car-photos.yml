            toyota-vios-new-model https://b2c-cdn.carsome.my/cdn-cgi/image/format%3Dauto%2Cquality%3D50%2Cwidth%3D1296/B2C/7673c487-cc33-451a-b7e5-40bdcd16c872.jpg
            ford-ranger https://b2c-cdn.carsome.my/cdn-cgi/image/format%3Dauto%2Cquality%3D50%2Cwidth%3D1296/B2C/709ae491-8856-4221-bd92-3666070b2f4f.JPG
          LIST
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cars-raw
          git commit -m "Download car photos into assets/cars-raw" || echo "nothing to commit"
          git push
