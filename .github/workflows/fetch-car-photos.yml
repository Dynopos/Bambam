name: Fetch car photos
on:
  push:
    branches: [ccr-25708ef3-21h2ff]
    paths: ['.github/workflows/fetch-car-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p assets/cars-raw
          while read -r name url; do
            [ -z "$name" ] && continue
            if curl -fsSL --retry 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -H "Accept: image/jpeg,image/png,image/*" -o "assets/cars-raw/$name" "$url"; then
              echo "OK   $name $(file -b --mime-type assets/cars-raw/$name) $(stat -c%s assets/cars-raw/$name)"
            else
              echo "FAIL $name"; rm -f "assets/cars-raw/$name"
            fi
          done <<'LIST'
            axia-new-model https://b2c-cdn.carsome.my/cdn-cgi/image/format%3Dauto%2Cquality%3D50%2Cwidth%3D1296/B2C/b8767671-53dc-47ac-bc2a-d69624327b88.JPG
            myvi-new-model-1-3 https://b2c-cdn.carsome.my/cdn-cgi/image/format%3Dauto%2Cquality%3D50%2Cwidth%3D1296/B2C/01d692d0-909d-43a0-972e-0fd499830325.jpg
